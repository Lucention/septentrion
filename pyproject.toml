[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "septentrion"
version = "0.1.0"
description = "Septentrion Aperture — Arctic MDA cross-modal fusion proof-of-concept"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Mike Ross", email = "mike@getboosted.io" }]
dependencies = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.6",
    "matplotlib>=3.9",
    "networkx>=3.4",
    "rasterio>=1.5,<1.6",
    "shapely>=2.1,<3",
    "pyproj>=3.7,<4",
    "geopandas>=1.1,<2",
    "pyogrio>=0.11",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "typer>=0.15",
]

[project.optional-dependencies]
cpu = ["torch>=2.6", "torchvision>=0.21"]
cu128 = ["torch>=2.6", "torchvision>=0.21"]

[project.scripts]
septentrion = "septentrion.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "ty>=0.0.1a1",
    "pre-commit>=4.0",
    "ipykernel>=6.29",
    "jupytext>=1.16",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/septentrion"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET", "PTH", "NPY", "PD", "RUF", "TID", "TC"]
ignore = ["E501", "B008", "SIM108", "RET504"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "PD901"]
"**/*.ipynb" = ["E402", "F401", "F811", "B018"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["septentrion"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.src]
root = "./src"

[tool.ty.rules]
unresolved-import = "ignore"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not slow and not gpu"]
markers = [
    "slow: long-running tests",
    "gpu: requires a CUDA device",
    "integration: needs heavy optional deps (gdal/torch)",
]

[tool.coverage.run]
source = ["septentrion"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
